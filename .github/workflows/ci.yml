name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - test   #check by push to test branch
      - main   #check after PR and push to main
  pull_request:
    branches: [ "main" ] #check by pull to main branch

jobs:
  test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #after set up go mod tidy will recreate go.sum if needed
      - name: Create empty go.sum(temporarily)
        run: |
          if [ ! -f go.sum ]; then
            echo "go.sum not found — creating an empty one"
            touch go.sum
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Install dependencies
        run: go mod tidy

      - name: Run build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

      - name: Run Go fuzz tests (dynamic analysis)
        run: go test -fuzz=Fuzz -fuzztime=5s ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9

      - name: Run golangci-lint
        run: golangci-lint run
        continue-on-error: true

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout сode
        uses: actions/checkout@v4

      - name: Run Gosec (as SAST)
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Install Semgrep CLI
        run: pip install semgrep

      - name: Semgrep Scan(SAST) with SARIF creation
        run: |
          semgrep scan --config p/golang --config p/owasp-top-ten --sarif-output semgrep.sarif .
          echo "=== SEMGREP SARIF OUTPUT ==="
          cat semgrep.sarif

      - name: Initialize CodeQL(yes, it needs to be initialized)
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
  sca:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OSV scan (dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.1
        with:
          scan-args: |
            -r .
            --format json
            --output osv-report.json
        continue-on-error: true

      - name: Show OSV report
        run: cat osv-report.json

      - name: Trivy fs scan (SCA + Config scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec (IaC scan)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: iac
          additional_args: --soft-fail
          version: v1.28.14

      - name: Run Checkov IaC scan(Not needed in other pojects, but it s learning project, with no prod)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: iac
          quiet: false
          soft_fail: false

  container-image:
    runs-on: ubuntu-latest
    needs: test-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app-dummy .

      - name: Save Docker image as tar
        run: docker save app-dummy:latest -o app-dummy.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dummy-image
          path: app-dummy.tar

  container-security:
    runs-on: ubuntu-latest
    needs: container-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dummy-image

      - name: Load Docker Image
        run: docker load -i app-dummy.tar

      - name: Grype scan (container image)
        uses: anchore/scan-action@v3
        with:
          image: app-dummy
          fail-build: false     #just for learning project
          output-format: table

      - name: Trivy image scan (for container security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app-dummy
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Generate Syft SBOM (CycloneDX) by container image
        uses: anchore/sbom-action@v0.15.0
        with:
          #when messed up with version, set syft-version
          upload-artifact: false
          image: app-dummy
          format: cyclonedx-json
          output-file: sbom.json

      - name: Install Grype CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Upgrade Grype Database
        run: grype db update

      - name: Check Gŕype DB Status(info only)
        run: grype db status || true

      - name: Grype scan (SBOM)
        env:
          GRYPE_DB_VALIDATE_AGE: "false"
        run: grype sbom:sbom.json -o table


      - name: Save SBOM artifact(in order to have possibility to download)
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  publish-image:
    runs-on: ubuntu-latest
    needs: [container-security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image artifact(.tar)
        uses: actions/download-artifact@v4
        with:
          name: app-dummy-image

      - name: Load Docker image(from .tar)
        run: docker load -i app-dummy.tar

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Tag image
        env:
          IMAGE_REPO: ghcr.io/${{github.repository_owner}}/app-dummy
        run: docker tag app-dummy:latest "${IMAGE_REPO}:${GITHUB_SHA}" && docker tag app-dummy:latest "${IMAGE_REPO}:latest"

      - name: Push image
        env:
          IMAGE_REPO: ghcr.io/${{github.repository_owner}}/app-dummy
        run: docker push "${IMAGE_REPO}:${GITHUB_SHA}" && docker push "${IMAGE_REPO}:latest"












